version: '3.8'

services:
  vinyl-groove-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DATABASE_URL=sqlite:///./vinyl_groove.db
    volumes:
      - ./:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
